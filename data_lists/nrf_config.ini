# NRF feature-extraction configuration (INI)
# -----------------------------------------------------------------------------
# PURPOSE
#   Define one or more "profiles" for NRF feature extraction. Each profile maps
#   directly onto the options structure passed to pop_estimate_response.m.
#
# HOW IT'S USED (typical flow)
#   1) Your script reads this file, selects a [profile] by section name.
#   2) It parses the six keys below into the correct MATLAB types.
#   3) It loops over each listed channel (one channel per pop_estimate_response call).
#   4) It passes the resulting options to pop_estimate_response(EEG, options).
#
# COMMENT & FORMAT RULES
#   - Comments start at the beginning of a line with '#' (no inline comments).
#   - Each profile begins with [profile_name] on its own line.
#   - Keys are given as key = value (case-insensitive for keys; your parser can normalize).
#   - Lists are comma-separated with optional spaces (e.g., "CZ, Cz").
#   - Empty value means "none" (e.g., projectionTimes_pre = ).
#   - All times are integers in milliseconds (ms).
#
# REQUIRED KEYS PER PROFILE (exactly these six; names match pop_estimate_response)
#   NRFName               : (string) Basename of the NRF template (no ".mat").
#                           File must be on MATLAB path and contain variables: NRF (vector), fs (Hz).
#                           IMPORTANT: fs must equal EEG.srate (no resampling in current code).
#
#   baselineLength        : (integer ms) Baseline correction length applied inside pop_rmbase as
#                           [-baselineLength, 0) ms. Epoched data must include this pre-stim window.
#
#   jitter                : (integer ms) Maximum ± temporal shift used for cross-correlation alignment.
#                           Ensure epochs cover: start_time − jitter  through  start_time + jitter + NRF_length.
#
#   channel               : (list of strings) One or more case-sensitive EEG channel labels.
#                           Example: "CZ, Cz"  (script loops; pop_estimate_response handles one at a time).
#
#   projectionTimes_pre   : (list of integers ms, negative) Pre-stimulus START times for fitting.
#                           Each entry triggers one fit. Leave blank for none.
#
#   projectionTimes_post  : (list of integers ms, positive) Post-stimulus START times for fitting.
#                           Each entry triggers one fit. Leave blank for none.
#
# WINDOW ENDPOINT LOGIC
#   There is NO explicit end-time key. The fit window ends implicitly at:
#       end_time = start_time + duration_of_NRF_template
#   Example: with a ~302 ms NRF and start=400 ms  →  window ≈ 400–702 ms.
#
# EPOCH COVERAGE CHECK
#   For any start_time T and jitter J, your epoch must contain:
#       [ T − J , T + J + NRF_length ]
#   Otherwise jittercorrect() or indexing in estimate_response() will error.
#
# TEMPLATE DURATIONS
#   early_NRF_500Hz.mat           | fs=500 Hz | N=126  | duration ≈ 252 ms
#   noxious_NRF_500Hz.mat         | fs=500 Hz | N=151  | duration ≈ 302 ms
#   noxious_preterm_NRF_500Hz.mat | fs=500 Hz | N=501  | duration ≈ 1002 ms
#
# Reminder: There is NO explicit end-time key. Fit window end = start_time + template_duration.
#
# DERIVED FIT WINDOWS FOR CURRENT PROFILES (using durations above)
#   [term_foot_nox]    post=400 ms, template≈302 ms  → window ≈ 400–702 ms
#   [term_thigh_nox]   post=300 ms, template≈302 ms  → window ≈ 300–602 ms
#   [term_hand_nox]    post=200 ms, template≈302 ms  → window ≈ 200–502 ms
#   [term_foot_early]  post=100 ms, template≈252 ms  → window ≈ 100–352 ms
#   [prem_foot_nox]    post=0 ms,   template≈1002 ms → window ≈   0–1002 ms
#
# Notes:
# - Changing projectionTimes_post or the NRF template changes these windows.
# - Jitter (±ms) affects alignment, NOT window length; ensure epoch coverage accordingly.
# - Multiple post times → multiple fits (one per start time).
#
# -----------------------------------------------------------------------------

[term_foot_nox]
NRFName = noxious_NRF_500Hz
baselineLength = 200
jitter = 100
channel = CZ, Cz
projectionTimes_pre =
projectionTimes_post = 400

[term_thigh_nox]
NRFName = noxious_NRF_500Hz
baselineLength = 200
jitter = 100
channel = CZ, Cz
projectionTimes_pre =
projectionTimes_post = 300

[term_hand_nox]
NRFName = noxious_NRF_500Hz
baselineLength = 200
jitter = 100
channel = CZ, Cz
projectionTimes_pre =
projectionTimes_post = 200

[term_foot_early]
NRFName = early_NRF_500Hz
baselineLength = 200
jitter = 100
channel = CZ, Cz
projectionTimes_pre =
projectionTimes_post = 100

[prem_foot_nox]
NRFName = noxious_preterm_NRF_500Hz
baselineLength = 200
jitter = 100
channel = CZ, Cz
projectionTimes_pre =
projectionTimes_post = 0